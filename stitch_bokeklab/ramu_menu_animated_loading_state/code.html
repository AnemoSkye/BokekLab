<style>
        .glass-warm {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(164, 55, 0, 0.05);
        }
        
        .bg-culinary-gradient {
            background: linear-gradient(135deg, #fcf9f8 0%, #ffdbcf 50%, #fcf9f8 100%);
            background-size: 400% 400%;
            animation: gradient-flow 15s ease infinite;
        }

        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb-1 {
            animation: orb-spin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transform-origin: center;
        }
        .orb-2 {
            animation: orb-spin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;
            transform-origin: center;
            animation-delay: -0.5s;
        }

        @keyframes orb-spin {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(0.8) rotate(360deg); opacity: 0.5; }
        }
        
        .pulse-text {
            animation: pulse-soft 2s ease-in-out infinite;
        }
        
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-culinary-gradient min-h-screen text-on-surface font-body-md text-body-md overflow-hidden flex selection:bg-primary-container selection:text-on-primary-container">
<!-- SideNavBar (Suppressed on this linear/transactional loading screen to prioritize the canvas) -->
<!-- Main Canvas -->
<main class="flex-1 w-full flex flex-col h-screen relative">
<!-- Decorative Background Orbs -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
<div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-secondary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-20" style="animation: pulse 4s ease-in-out infinite reverse;"></div>
<!-- Content Area -->
<div class="flex-1 flex items-center justify-center p-margin-mobile md:p-margin-desktop z-10">
<!-- Frosted Glass Loading Card -->
<div class="glass-warm rounded-[32px] p-lg w-full max-w-lg flex flex-col items-center text-center gap-lg relative overflow-hidden">
<!-- Subtle Top Highlight -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-30"></div>
<div class="relative w-32 h-32 flex items-center justify-center">
<div class="absolute inset-0 orb-1 border-4 border-primary rounded-full opacity-80 border-t-transparent border-l-transparent"></div>
<div class="absolute inset-4 orb-2 border-4 border-secondary-container rounded-full opacity-60 border-b-transparent border-r-transparent"></div>
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                        auto_awesome
                    </span>
</div>
<div class="flex flex-col gap-sm">
<h1 class="font-headline-md text-headline-md text-primary">Sabar ya...</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant pulse-text max-w-sm mx-auto">
                        AI lagi meracik bumbu rahasia buat kamu...
                    </p>
</div>
<!-- Loading Progress Bar (Fake) -->
<div class="w-full max-w-xs h-2 bg-surface-variant rounded-full overflow-hidden mt-sm">
<div class="h-full bg-primary rounded-full w-1/3 animate-[pulse_2s_ease-in-out_infinite]" style="animation: loading-bar 3s ease-in-out infinite;"></div>
</div>
<style>
                    @keyframes loading-bar {
                        0% { width: 0%; transform: translateX(-100%); }
                        50% { width: 70%; transform: translateX(0); }
                        100% { width: 100%; transform: translateX(100%); }
                    }
                </style>
</div>
</div>
</main>
